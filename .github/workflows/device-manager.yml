name: DeviceManager

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:all
      - name: Verify external UI artifact
        run: test -s dist/DeviceManagerUI/index.html && test -s dist/DeviceManagerUI/device-manager.js
