name: Package

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            arch: x64
            builder_args: '--mac dmg'
          - platform: macos
            runner: macos-latest
            arch: arm64
            builder_args: '--mac dmg'
          - platform: ubuntu
            runner: ubuntu-latest
            arch: x64
            builder_args: '--linux AppImage deb'
          - platform: windows
            runner: windows-latest
            arch: x64
            builder_args: '--win nsis'

    env:
      HAS_SIGNING: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build:all
      - name: Package application without signing
        if: env.HAS_SIGNING != 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish never ${{ matrix.builder_args }} --${{ matrix.arch }}
      - name: Package application with signing
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish never ${{ matrix.builder_args }} --${{ matrix.arch }}
      - name: Validate macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_path="$(find release/build -type d -name 'APKInstaller.app' -print -quit)"
          test -n "$app_path"
          test -x "$app_path/Contents/MacOS/APKInstaller"
          test -s "$app_path/Contents/Resources/app.asar"
          test -f release/build/*.dmg
      - name: Upload macOS DMG artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: APKInstaller-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/build/*.dmg
            release/build/*.dmg.blockmap
            release/build/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaged artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: APKInstaller-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: release/build/*
          if-no-files-found: error
          retention-days: 14

  device-manager-ui:
    name: DeviceManager UI bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build external DeviceManager UI artifact
        run: npm run build:device-manager-ui
      - name: Validate UI artifact contract
        shell: bash
        run: test -s dist/DeviceManagerUI/index.html && test -s dist/DeviceManagerUI/device-manager.js
      - name: Upload DeviceManager UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceManagerUI-${{ github.sha }}
          path: dist/DeviceManagerUI
          if-no-files-found: error
          retention-days: 14
